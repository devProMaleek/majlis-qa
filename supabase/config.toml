#:schema https://supabase.com/schemas/config/v1.json
project_id = "majlis-qa-foundation"

[api]
enabled = true
port = 54391
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54392
shadow_port = 54390
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true

[db.seed]
enabled = false

[db.pooler]
enabled = false
port = 54399

[realtime]
enabled = false

[studio]
enabled = true
port = 54393
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54394

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/staff", "http://127.0.0.1:3100/staff"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[auth.rate_limit]
# Local-only capacity for repeated integration runs. Review hosted rate limits separately.
sign_in_sign_ups = 100
token_refresh = 150
email_sent = 2

[edge_runtime]
enabled = false

[analytics]
enabled = false
